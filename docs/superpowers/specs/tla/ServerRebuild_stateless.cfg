\* STATELESS decision: act from spec vs a fresh Nova read alone, no marker.
\* Nova error semantics: the reported ref stays at the OLD image
\* (RefUpdatesAtAccept = FALSE). Expected: AcceptBudget FAILS - after
\* a provider error the divergence check resubmits the destructive rebuild
\* with no new user intent (the double-wipe loop).
SPECIFICATION Spec
CONSTANTS
  LevelWake = TRUE
  UseFence = TRUE
  UsePreArm = TRUE
  RequeueOn409 = TRUE
  UseMarker = FALSE
  RefUpdatesAtAccept = FALSE
INVARIANTS
  TypeOK
  AcceptBudget
CONSTRAINT
  Constraint
