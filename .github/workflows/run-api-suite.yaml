name: Run API Suite
# Reusable building block: run the region API suite against ONE deployed environment.
# Called by test-api.yaml (nightly/dispatch) and by external release-evidence callers
# (e.g. k8s-cluster-nks on a staging promotion). Being workflow_call-only, it has no
# event-name logic: behaviour is driven entirely by inputs.
#
# Release-evidence behaviour is inert unless `expected_version` is set: when set, the
# resolver gates on the deployed version matching it and a versions-summary artifact is
# produced (even on gate failure). Callers must pass `secrets: inherit` and grant
# `id-token: write` (the test jobs need it for Teleport/Grafana).
on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment: dev or uat'
        type: string
        required: true
      expected_version:
        description: 'If set, gate the run on the deployed version matching it (release evidence)'
        type: string
        required: false
        default: ''
      focus:
        description: 'Single test area to run (ignored when smoke=true)'
        type: string
        required: false
        default: 'All'
      smoke:
        description: 'Run only the curated smoke subset'
        type: boolean
        required: false
        default: false
      region_id:
        description: 'Override TEST_REGION_ID'
        type: string
        required: false
        default: ''
      skip_slack_notifications:
        description: 'Skip the Slack report'
        type: boolean
        required: false
        default: false
      use_deployed_version:
        description: 'Resolve the checkout ref from the deployed version API (vs the called ref)'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  # Always runs (this is a call-only workflow), so resolvers can depend on it with plain
  # success() semantics: a failed guard blocks them, there is no skipped-guard case.
  validate-inputs:
    name: Validate inputs
    runs-on: ubuntu-latest
    steps:
    - name: Guard environment and focus
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        FOCUS: ${{ inputs.focus }}
      run: |
        case "$ENVIRONMENT" in
          dev|uat) ;;
          *) echo "::error::environment must be dev|uat, got '$ENVIRONMENT'"; exit 1;;
        esac
        case "${FOCUS:-All}" in
          All|'Region Discovery'|'Flavor Discovery'|'Image Discovery'|'External Network Discovery'|'File Storage Management'|'Block Storage'|'Network Management'|'SecurityGroup'|'LoadBalancer') ;;
          *) echo "::error::unknown focus '$FOCUS'"; exit 1;;
        esac

  find-dev-deployed-version:
    name: Resolve Dev test ref
    runs-on: ubuntu-latest
    needs: [validate-inputs]
    if: inputs.environment == 'dev'
    outputs:
      ref: ${{ steps.find.outputs.ref }}
      version: ${{ steps.find.outputs.version }}
    steps:
    - name: Resolve Dev checkout ref
      uses: nscaledev/quality-tooling/.github/actions/uni-find-staging-constellation@main
      id: find
      with:
        service: uni-region
        releases-read-token: ${{ secrets.RELEASES_READ_TOKEN }}
        use-staging-constellation: ${{ inputs.use_deployed_version }}
        use-version-api: true
        version-api-url: ${{ vars.DEV_REGION_BASE_URL }}/api/version
        version-api-token: ${{ secrets.DEV_API_AUTH_TOKEN }}
        fallback-to-constellation: false
        summary-title: Dev API Test Version

    - name: Gate on expected version
      id: gate
      if: inputs.expected_version != ''
      env:
        EXPECTED: ${{ inputs.expected_version }}
        DEPLOYED: ${{ steps.find.outputs.version }}
      run: |
        norm() { printf '%s' "${1#v}"; }
        exp="$(norm "$EXPECTED")"; got="$(norm "$DEPLOYED")"
        if [ -z "$got" ]; then
          echo "::error::no deployed version resolved for the gate"; exit 1
        fi
        if [ "$exp" != "$got" ]; then
          echo "::error::version mismatch: expected '$exp' but '$got' is deployed; not running evidence tests"; exit 1
        fi
        echo "version gate passed: $got"

    - name: Write versions summary
      if: ${{ always() && inputs.expected_version != '' }}
      env:
        ENVIRONMENT_NAME: dev
        EXPECTED: ${{ inputs.expected_version }}
        DEPLOYED: ${{ steps.find.outputs.version }}
        REF: ${{ steps.find.outputs.ref }}
        FIND_OUTCOME: ${{ steps.find.outcome }}
        GATE_OUTCOME: ${{ steps.gate.outcome }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        if [ "$FIND_OUTCOME" != "success" ] || [ -z "$DEPLOYED" ]; then
          gate_result="unresolved"
        elif [ "$GATE_OUTCOME" = "success" ]; then
          gate_result="passed"
        else
          gate_result="failed"
        fi
        jq -n \
          --arg component uni-region \
          --arg environment "$ENVIRONMENT_NAME" \
          --arg expected "$EXPECTED" \
          --arg tested "$DEPLOYED" \
          --arg ref "$REF" \
          --arg gate "$gate_result" \
          --arg run_url "$RUN_URL" \
          --arg timestamp "$ts" \
          '{component:$component, environment:$environment, expected_version:$expected,
            tested_version:$tested, ref:$ref, gate_result:$gate, run_url:$run_url,
            timestamp:$timestamp}' > versions-summary.json

    - name: Archive versions summary
      if: ${{ always() && inputs.expected_version != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: versions-summary-dev
        path: versions-summary.json
        retention-days: 180

  API-Tests-Dev:
    name: API Tests (dev)
    needs: find-dev-deployed-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for Teleport-backed Grafana lookup and OTLP collector shipping.
      id-token: write
    if: inputs.environment == 'dev' && needs.find-dev-deployed-version.outputs.ref != ''
    env:
      ENVIRONMENT: dev
      FOCUS: ${{ inputs.focus || 'All' }}
      API_BASE_URL: ${{ vars.DEV_API_BASE_URL }}
      REGION_BASE_URL: ${{ vars.DEV_REGION_BASE_URL }}
      API_AUTH_TOKEN: ${{ secrets.DEV_API_AUTH_TOKEN }}
      TEST_ORG_ID: ${{ vars.DEV_TEST_ORG_ID }}
      TEST_PROJECT_ID: ${{ vars.DEV_TEST_PROJECT_ID }}
      TEST_REGION_ID: ${{ inputs.region_id || vars.DEV_TEST_REGION_ID }}
      TEST_NETWORK_ID: ${{ vars.DEV_TEST_NETWORK_ID }}
      FAKE_TEST_REGION_ID: ${{ vars.DEV_FAKE_TEST_REGION_ID }}
      FAKE_TEST_NETWORK_ID: ${{ vars.DEV_FAKE_TEST_NETWORK_ID }}
      FAKE_TEST_VOLUME_CLASS_ID: ${{ vars.DEV_FAKE_TEST_VOLUME_CLASS_ID }}
      FAKE_TEST_SERVER_FLAVOR_ID: ${{ vars.DEV_FAKE_TEST_SERVER_FLAVOR_ID }}
      FAKE_TEST_SERVER_IMAGE_ID: ${{ vars.DEV_FAKE_TEST_SERVER_IMAGE_ID }}
      TEST_PRIVATE_REGION_ID: ${{ vars.DEV_TEST_PRIVATE_REGION_ID }}
      TEST_SECONDARY_ORG_ID: ${{ vars.DEV_TEST_SECONDARY_ORG_ID }}
      TEST_SECONDARY_PROJECT_ID: ${{ vars.DEV_TEST_SECONDARY_PROJECT_ID }}
      TEST_SECONDARY_AUTH_TOKEN: ${{ secrets.DEV_TEST_SECONDARY_AUTH_TOKEN }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.find-dev-deployed-version.outputs.ref }}

    - name: Setup Go
      uses: actions/setup-go@v3
      with:
        go-version-file: go.mod
        cache: true

    - name: Touch
      run: make touch

    - name: Run API Tests (smoke)
      if: inputs.smoke == true
      run: make test-api-smoke

    - name: Run API Tests
      if: inputs.smoke != true && (inputs.focus == '' || inputs.focus == 'All')
      run: make test-api

    - name: Run API Tests with Focus
      if: inputs.smoke != true && inputs.focus != '' && inputs.focus != 'All'
      run: make test-api-focus FOCUS="$FOCUS"

    - name: Archive API Test Results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: api-test-results-dev
        path: test-results.json
        retention-days: 180

    - name: Archive API Test JUnit Report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: api-test-junit-dev
        path: junit.xml
        retention-days: 180

    - name: Create Linear Issues for Test Failures
      uses: nscaledev/quality-tooling/.github/actions/linear-test-failures@main
      if: ${{ !cancelled() }}
      with:
        test-results-path: test-results.json
        workflow-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        linear-api-key: ${{ secrets.LINEAR_API_KEY }}
        linear-team-id: ${{ vars.LINEAR_TEAM_ID }}
        linear-project-id: ${{ vars.LINEAR_PROJECT_ID }}
        environment: dev
        linear-priority: '3'
        max-failures: '5'

    - name: Report API Test Results
      uses: nscaledev/quality-tooling/.github/actions/test-results-report@main
      if: ${{ !cancelled() }}
      with:
        test-results-path: test-results.json
        format: ginkgo-json
        workflow-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
        send-slack: ${{ inputs.skip_slack_notifications != true && 'true' || 'false' }}
        environment: dev
        deployed-version: ${{ needs.find-dev-deployed-version.outputs.version || needs.find-dev-deployed-version.outputs.ref }}
        title: 'Region API Test Results'
        test-history-suite: uni-region-api
        component-name: uni-region
        component-repo: nscaledev/uni-region
        component-ref: ${{ needs.find-dev-deployed-version.outputs.ref }}
        component-version-url: ${{ env.REGION_BASE_URL }}/api/version
        component-version-token: ${{ env.API_AUTH_TOKEN }}
        enable-ai-analysis: 'true'
        claude-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        enable-grafana-log-enrichment: 'true'
        grafana-service-account-token: ${{ secrets.GRAFANA_SERVICE_ACCOUNT_TOKEN }}
        enable-unikorn-cr-enrichment: 'true'
        unikorn-cr-teleport-token: github-unikorn-cr-reader
        unikorn-cr-kube-cluster: uni-dev-glo1

  find-uat-deployed-version:
    name: Resolve UAT test ref
    runs-on: ubuntu-latest
    needs: [validate-inputs]
    if: inputs.environment == 'uat'
    outputs:
      ref: ${{ steps.find.outputs.ref }}
      version: ${{ steps.find.outputs.version }}
    steps:
    - name: Resolve UAT checkout ref
      uses: nscaledev/quality-tooling/.github/actions/uni-find-staging-constellation@main
      id: find
      with:
        service: uni-region
        releases-read-token: ${{ secrets.RELEASES_READ_TOKEN }}
        use-staging-constellation: ${{ inputs.use_deployed_version }}
        use-version-api: true
        version-api-url: ${{ vars.UAT_REGION_BASE_URL }}/api/version
        version-api-token: ${{ secrets.UAT_API_AUTH_TOKEN }}
        fallback-to-constellation: false
        summary-title: UAT API Test Version

    - name: Gate on expected version
      id: gate
      if: inputs.expected_version != ''
      env:
        EXPECTED: ${{ inputs.expected_version }}
        DEPLOYED: ${{ steps.find.outputs.version }}
      run: |
        norm() { printf '%s' "${1#v}"; }
        exp="$(norm "$EXPECTED")"; got="$(norm "$DEPLOYED")"
        if [ -z "$got" ]; then
          echo "::error::no deployed version resolved for the gate"; exit 1
        fi
        if [ "$exp" != "$got" ]; then
          echo "::error::version mismatch: expected '$exp' but '$got' is deployed; not running evidence tests"; exit 1
        fi
        echo "version gate passed: $got"

    - name: Write versions summary
      if: ${{ always() && inputs.expected_version != '' }}
      env:
        ENVIRONMENT_NAME: uat
        EXPECTED: ${{ inputs.expected_version }}
        DEPLOYED: ${{ steps.find.outputs.version }}
        REF: ${{ steps.find.outputs.ref }}
        FIND_OUTCOME: ${{ steps.find.outcome }}
        GATE_OUTCOME: ${{ steps.gate.outcome }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        if [ "$FIND_OUTCOME" != "success" ] || [ -z "$DEPLOYED" ]; then
          gate_result="unresolved"
        elif [ "$GATE_OUTCOME" = "success" ]; then
          gate_result="passed"
        else
          gate_result="failed"
        fi
        jq -n \
          --arg component uni-region \
          --arg environment "$ENVIRONMENT_NAME" \
          --arg expected "$EXPECTED" \
          --arg tested "$DEPLOYED" \
          --arg ref "$REF" \
          --arg gate "$gate_result" \
          --arg run_url "$RUN_URL" \
          --arg timestamp "$ts" \
          '{component:$component, environment:$environment, expected_version:$expected,
            tested_version:$tested, ref:$ref, gate_result:$gate, run_url:$run_url,
            timestamp:$timestamp}' > versions-summary.json

    - name: Archive versions summary
      if: ${{ always() && inputs.expected_version != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: versions-summary-uat
        path: versions-summary.json
        retention-days: 180

  API-Tests-UAT:
    name: API Tests (uat)
    needs: find-uat-deployed-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for Teleport-backed Grafana lookup and OTLP collector shipping.
      id-token: write
    if: inputs.environment == 'uat' && needs.find-uat-deployed-version.outputs.ref != ''
    env:
      ENVIRONMENT: uat
      FOCUS: ${{ inputs.focus || 'All' }}
      API_BASE_URL: ${{ vars.UAT_API_BASE_URL }}
      REGION_BASE_URL: ${{ vars.UAT_REGION_BASE_URL }}
      API_AUTH_TOKEN: ${{ secrets.UAT_API_AUTH_TOKEN }}
      TEST_ORG_ID: ${{ vars.UAT_TEST_ORG_ID }}
      TEST_PROJECT_ID: ${{ vars.UAT_TEST_PROJECT_ID }}
      TEST_REGION_ID: ${{ inputs.region_id || vars.UAT_TEST_REGION_ID }}
      TEST_NETWORK_ID: ${{ vars.UAT_TEST_NETWORK_ID }}
      FAKE_TEST_REGION_ID: ${{ vars.UAT_FAKE_TEST_REGION_ID }}
      FAKE_TEST_NETWORK_ID: ${{ vars.UAT_FAKE_TEST_NETWORK_ID }}
      FAKE_TEST_VOLUME_CLASS_ID: ${{ vars.UAT_FAKE_TEST_VOLUME_CLASS_ID }}
      FAKE_TEST_SERVER_FLAVOR_ID: ${{ vars.UAT_FAKE_TEST_SERVER_FLAVOR_ID }}
      FAKE_TEST_SERVER_IMAGE_ID: ${{ vars.UAT_FAKE_TEST_SERVER_IMAGE_ID }}
      TEST_PRIVATE_REGION_ID: ${{ vars.UAT_TEST_PRIVATE_REGION_ID }}
      TEST_SECONDARY_ORG_ID: ${{ vars.UAT_TEST_SECONDARY_ORG_ID }}
      TEST_SECONDARY_PROJECT_ID: ${{ vars.UAT_TEST_SECONDARY_PROJECT_ID }}
      TEST_SECONDARY_AUTH_TOKEN: ${{ secrets.UAT_TEST_SECONDARY_AUTH_TOKEN }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.find-uat-deployed-version.outputs.ref }}

    - name: Setup Go
      uses: actions/setup-go@v3
      with:
        go-version-file: go.mod
        cache: true

    - name: Touch
      run: make touch

    - name: Import internal API credentials from Vault
      # Pinned SHA matches hashicorp/vault-action v4.0.0.
      uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc
      with:
        url: https://vault.nscale.com
        method: jwt
        path: jwt-github-actions
        role: uni-region-e2e
        jwtGithubAudience: https://vault.nscale.com
        secrets: >-
          cloud-native/data/europe-west2/nks-stg/e2e/uat-test-runner/client-tls cert | UAT_INTERNAL_API_CLIENT_CERT ;
          cloud-native/data/europe-west2/nks-stg/e2e/uat-test-runner/client-tls key | UAT_INTERNAL_API_CLIENT_KEY

    - name: Write internal API credentials
      run: |
        : "${UAT_INTERNAL_API_CLIENT_CERT:?UAT_INTERNAL_API_CLIENT_CERT is required}"
        : "${UAT_INTERNAL_API_CLIENT_KEY:?UAT_INTERNAL_API_CLIENT_KEY is required}"

        cert_path="${RUNNER_TEMP}/uat-internal-api-client.crt"
        key_path="${RUNNER_TEMP}/uat-internal-api-client.key"

        printf '%s\n' "$UAT_INTERNAL_API_CLIENT_CERT" > "$cert_path"
        printf '%s\n' "$UAT_INTERNAL_API_CLIENT_KEY" > "$key_path"
        chmod 600 "$cert_path" "$key_path"

        echo "INTERNAL_API_CLIENT_CERT=$cert_path" >> "$GITHUB_ENV"
        echo "INTERNAL_API_CLIENT_KEY=$key_path" >> "$GITHUB_ENV"

    - name: Run API Tests (smoke)
      if: inputs.smoke == true
      run: make test-api-smoke

    - name: Run API Tests
      if: inputs.smoke != true && (inputs.focus == '' || inputs.focus == 'All')
      run: make test-api

    - name: Run API Tests with Focus
      if: inputs.smoke != true && inputs.focus != '' && inputs.focus != 'All'
      run: make test-api-focus FOCUS="$FOCUS"

    - name: Archive API Test Results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: api-test-results-uat
        path: test-results.json
        retention-days: 180

    - name: Archive API Test JUnit Report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: api-test-junit-uat
        path: junit.xml
        retention-days: 180

    - name: Create Linear Issues for Test Failures
      uses: nscaledev/quality-tooling/.github/actions/linear-test-failures@main
      if: ${{ !cancelled() }}
      with:
        test-results-path: test-results.json
        workflow-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        linear-api-key: ${{ secrets.LINEAR_API_KEY }}
        linear-team-id: ${{ vars.LINEAR_TEAM_ID }}
        linear-project-id: ${{ vars.LINEAR_PROJECT_ID }}
        environment: uat
        linear-priority: '3'
        max-failures: '5'

    - name: Report API Test Results
      uses: nscaledev/quality-tooling/.github/actions/test-results-report@main
      if: ${{ !cancelled() }}
      with:
        test-results-path: test-results.json
        format: ginkgo-json
        workflow-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
        send-slack: ${{ inputs.skip_slack_notifications != true && 'true' || 'false' }}
        environment: uat
        deployed-version: ${{ needs.find-uat-deployed-version.outputs.version || needs.find-uat-deployed-version.outputs.ref }}
        title: 'Region API Test Results'
        test-history-suite: uni-region-api
        component-name: uni-region
        component-repo: nscaledev/uni-region
        component-ref: ${{ needs.find-uat-deployed-version.outputs.ref }}
        component-version-url: ${{ env.REGION_BASE_URL }}/api/version
        component-version-token: ${{ env.API_AUTH_TOKEN }}
        enable-ai-analysis: 'true'
        claude-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        enable-grafana-log-enrichment: 'true'
        grafana-service-account-token: ${{ secrets.GRAFANA_SERVICE_ACCOUNT_TOKEN }}
        enable-unikorn-cr-enrichment: 'true'
        unikorn-cr-teleport-token: github-unikorn-cr-reader
        unikorn-cr-kube-cluster: nks-stg-europe-west2

  # Alerts when the requested environment's tests did not run (e.g. an expired version-api
  # token skips the test job, so nothing else posts to Slack).
  notify-skipped-api-tests:
    name: Notify skipped API tests
    needs:
    - find-dev-deployed-version
    - API-Tests-Dev
    - find-uat-deployed-version
    - API-Tests-UAT
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && inputs.skip_slack_notifications != true }}
    steps:
    - name: Notify Slack that Dev API tests did not run
      if: inputs.environment == 'dev' && needs.API-Tests-Dev.result == 'skipped'
      uses: slackapi/slack-github-action@v2
      with:
        webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
        webhook-type: incoming-webhook
        payload: |
          {
            "text": ":red_circle: *Region API Tests (dev) did not run* — `${{ github.repository }}`. Resolve Dev test ref finished with `${{ needs.find-dev-deployed-version.result }}` — see the run for the cause.\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }

    - name: Notify Slack that UAT API tests did not run
      if: inputs.environment == 'uat' && needs.API-Tests-UAT.result == 'skipped'
      uses: slackapi/slack-github-action@v2
      with:
        webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
        webhook-type: incoming-webhook
        payload: |
          {
            "text": ":red_circle: *Region API Tests (uat) did not run* — `${{ github.repository }}`. Resolve UAT test ref finished with `${{ needs.find-uat-deployed-version.result }}` — see the run for the cause.\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
