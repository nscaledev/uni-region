name: API Tests
# Thin scheduler/dispatcher for the region API suite. The actual work lives in the reusable
# run-api-suite.yaml; this file only decides which environments run on the nightly schedule
# and on manual dispatch. It passes no expected_version, so the version gate is inert here —
# nightly/dispatch runs are regression, not release evidence.
on:
  schedule:
    - cron: '0 7 * * *'  # Run nightly at 7am UTC
  workflow_dispatch:
    inputs:
      run_dev:
        description: 'Run Dev tests'
        type: boolean
        default: true
      run_uat:
        description: 'Run UAT tests'
        type: boolean
        default: false
      use_dev_deployed_version:
        description: 'Use the deployed Dev version for Dev checkout'
        type: boolean
        default: true
      use_staging_constellation:
        description: 'Use the staged constellation tag for UAT checkout'
        type: boolean
        default: true
      skip_slack_notifications:
        description: 'Skip Slack notifications'
        type: boolean
        default: false
      smoke:
        description: 'Run only the curated smoke subset'
        type: boolean
        default: false
      focus:
        description: 'Test suite to run'
        required: false
        default: 'All'
        type: choice
        options:
          - 'All'
          - 'Region Discovery'
          - 'Flavor Discovery'
          - 'Image Discovery'
          - 'External Network Discovery'
          - 'File Storage Management'
          - 'Block Storage'
          - 'Network Management'
          - 'SecurityGroup'
          - 'LoadBalancer'
      region_id:
        description: 'Override TEST_REGION_ID (leave empty to use default)'
        type: string
        required: false

permissions:
  contents: read
  # Granted so the reusable's test jobs can request it (Teleport/Grafana).
  id-token: write

jobs:
  dev:
    name: Dev
    if: github.event_name == 'schedule' || github.event.inputs.run_dev == 'true'
    uses: ./.github/workflows/run-api-suite.yaml
    with:
      environment: dev
      focus: ${{ github.event.inputs.focus || 'All' }}
      smoke: ${{ github.event.inputs.smoke == 'true' }}
      region_id: ${{ github.event.inputs.region_id || '' }}
      skip_slack_notifications: ${{ github.event.inputs.skip_slack_notifications == 'true' }}
      use_deployed_version: ${{ github.event_name == 'schedule' || github.event.inputs.use_dev_deployed_version != 'false' }}
    secrets: inherit

  uat:
    name: UAT
    if: github.event_name == 'schedule' || github.event.inputs.run_uat == 'true'
    uses: ./.github/workflows/run-api-suite.yaml
    with:
      environment: uat
      focus: ${{ github.event.inputs.focus || 'All' }}
      smoke: ${{ github.event.inputs.smoke == 'true' }}
      region_id: ${{ github.event.inputs.region_id || '' }}
      skip_slack_notifications: ${{ github.event.inputs.skip_slack_notifications == 'true' }}
      use_deployed_version: ${{ github.event_name == 'schedule' || github.event.inputs.use_staging_constellation != 'false' }}
    secrets: inherit
