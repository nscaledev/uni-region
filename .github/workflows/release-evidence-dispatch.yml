name: Release evidence (dispatch)

# A k8s-cluster-nks staging promotion requests an evidence run here via a
# release-evidence-request dispatch. We wait for the promoted version to deploy
# to staging, run the callable API suite against it, and return the summary to
# the caller (release-evidence-result) for it to store.

on:
  repository_dispatch:
    types: [release-evidence-request]

permissions:
  contents: read

concurrency:
  group: release-evidence-${{ github.event.client_payload.component }}-${{ github.event.client_payload.version }}
  cancel-in-progress: false

jobs:
  wait-for-deploy:
    name: Wait for ${{ github.event.client_payload.version }} on staging
    runs-on: ubuntu-24.04
    steps:
      - name: Poll the staging version API
        env:
          EXPECTED: ${{ github.event.client_payload.version }}
          URL: ${{ vars.UAT_REGION_BASE_URL }}/api/version
          TOKEN: ${{ secrets.UAT_API_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          exp="${EXPECTED#v}"
          for i in $(seq 1 30); do
            # A transient error mid-rollout must not end the wait; treat it as
            # "not yet" and keep polling until the real timeout.
            got="$(curl -fsS -H "Authorization: Bearer $TOKEN" "$URL" | jq -r '.version // empty' || true)"
            got="${got#v}"
            echo "attempt $i: deployed='$got' expected='$exp'"
            [ "$got" = "$exp" ] && { echo "deployed"; exit 0; }
            sleep 30
          done
          # The suite's own gate records the outcome; a timeout is a blocked
          # promotion, not a reason to skip the evidence run.
          echo "::warning::staging did not report '$exp' within the wait; running the suite anyway"

  evidence:
    name: Run the suite
    needs: wait-for-deploy
    if: always()
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/run-api-suite.yaml
    with:
      environment: uat
      expected_version: ${{ github.event.client_payload.version }}
      smoke: true
    secrets: inherit

  report:
    name: Return the summary to the caller
    needs: evidence
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Download the summary
        uses: actions/download-artifact@v4
        with:
          name: versions-summary-uat
        continue-on-error: true
      - name: Build the result payload
        env:
          COMPONENT: ${{ github.event.client_payload.component }}
          VERSION: ${{ github.event.client_payload.version }}
          # The gate-only summary cannot tell a failed smoke run from a passed
          # one; the suite job's conclusion carries the test outcome.
          SUITE_RESULT: ${{ needs.evidence.result }}
        run: |
          set -euo pipefail
          if [ -f versions-summary.json ]; then
            summary="$(jq -c . versions-summary.json)"
          else
            summary='null'
          fi
          jq -n \
            --arg component "$COMPONENT" \
            --arg version "$VERSION" \
            --arg suite_result "$SUITE_RESULT" \
            --argjson summary "$summary" \
            '{event_type: "release-evidence-result",
              client_payload: {component: $component, version: $version,
                               suite_result: $suite_result, summary: $summary}}' \
            > payload.json
      - name: Mint caller dispatch token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.NSCALE_ACTIONS_APP_ID }}
          private-key: ${{ secrets.NSCALE_ACTIONS_APP_PK }}
          owner: ${{ github.repository_owner }}
          repositories: k8s-cluster-nks
      - name: Return the result
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          CALLBACK_REPO: ${{ github.event.client_payload.callback_repo }}
        run: gh api --method POST "repos/$CALLBACK_REPO/dispatches" --input payload.json
