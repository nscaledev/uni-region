apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-monitor
  labels:
    {{- include "unikorn.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-monitor
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-monitor
    spec:
      containers:
      - name: {{ .Release.Name }}-monitor
        image: {{ include "unikorn.regionMonitorImage" . }}
        args:
        - --namespace={{ .Release.Namespace }}
        {{- include "unikorn.otlp.flags" . | nindent 8 }}
        env:
        - name: OTEL_SERVICE_NAME
          value: {{ .Release.Name }}-monitor
        {{- with .Values.monitor.memoryLimit }}
        # Validated here because a malformed GOMEMLIMIT is a fatal error before
        # main, so a typo would be a crash-loop with nothing logged. Go accepts
        # only B, KiB, MiB, GiB and TiB -- not Kubernetes' Mi.
        {{- if not (regexMatch "^[0-9]+(B|KiB|MiB|GiB|TiB)$" (toString .)) }}
        {{- fail (printf "monitor.memoryLimit %q is not a Go memory limit: use a byte count with an optional B, KiB, MiB, GiB or TiB suffix (not Kubernetes' Mi/M/MB)" .) }}
        {{- end }}
        - name: GOMEMLIMIT
          value: {{ . | quote }}
        {{- end }}
        resources:
          {{- .Values.monitor.resources | toYaml | nindent 10 }}
        securityContext:
          readOnlyRootFilesystem: true
      serviceAccountName: {{ .Release.Name }}-monitor
      securityContext:
        runAsNonRoot: true
