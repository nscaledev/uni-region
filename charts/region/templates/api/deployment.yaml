apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-server
  labels:
    {{- include "unikorn.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-server
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-server
    spec:
      containers:
      - name: {{ .Release.Name }}-server
        image: {{ include "unikorn.serverImage" . }}
        args:
        {{- include "unikorn.core.flags" . | nindent 8 }}
        {{- include "unikorn.cors.flags" . | nindent 8 }}
        {{- include "unikorn.otlp.flags" . | nindent 8 }}
        {{- if not .Values.spiffe.enabled }}
        {{- include "unikorn.mtls.flags" . | nindent 8 }}
        {{- end }}
        {{- include "unikorn.identity.flags" . | nindent 8 }}
        {{- if .Values.spiffe.enabled }}
        {{- include "unikorn.spiffe.flags" . | nindent 8 }}
        {{- end }}
        {{- range $i, $arg := .Values.server.extraFlags }}
        - {{ $arg }}
        {{- end }}
        {{- if .Values.spiffe.enabled }}
        env:
          {{- include "unikorn.spiffe.env" . | nindent 8 }}
        {{- end }}
        ports:
        - name: http
          containerPort: 6080
        - name: prometheus
          containerPort: 8080
        - name: pprof
          containerPort: 6060
        resources:
          {{- .Values.server.resources | toYaml | nindent 10 }}
        readinessProbe:
          httpGet:
            path: /.well-known/openid-protected-resource
            port: 6080
        securityContext:
          readOnlyRootFilesystem: true
        {{- if .Values.spiffe.enabled }}
        volumeMounts:
          {{- include "unikorn.spiffe.volumeMounts" . | nindent 8 }}
        {{- end }}
      serviceAccountName: {{ .Release.Name }}-server
      securityContext:
        runAsNonRoot: true
      {{- if .Values.spiffe.enabled }}
      volumes:
        {{- include "unikorn.spiffe.volumes" . | nindent 6 }}
      {{- end }}
