apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-server
  labels:
    {{- include "unikorn.labels" . | nindent 4 }}
rules:
# The API server reads directly from the API server, so everything it reads
# singly needs get; nothing needs watch. Written kinds keep their write verbs.
- apiGroups:
  - region.unikorn-cloud.org
  resources:
  - regions
  - filestorageclasses
  verbs:
  - get
  - list
- apiGroups:
  - region.unikorn-cloud.org
  resources:
  - identities
  - networks
  - securitygroups
  - loadbalancers
  - servers
  - filestorages
  - filestoragesnapshots
  - volumes
  - sshcertificateauthorities
  verbs:
  - get
  - list
  - create
  - delete
  - patch
  - update
- apiGroups:
  - region.unikorn-cloud.org
  resources:
  - servers/status
  verbs:
  - patch
- apiGroups:
  - region.unikorn-cloud.org
  resources:
  - openstackidentities
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
