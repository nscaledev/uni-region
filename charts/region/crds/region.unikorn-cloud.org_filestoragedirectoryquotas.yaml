                          properties:
                            usedCapacity:
                              anyOf:
                              - type: integer
                              - type: string
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            usedInodes:
                              format: int64
                              type: integer
                          type: object
                      required:
                      - subject
                      - usage
                      type: object
                    maxItems: 20
                    type: array
                    x-kubernetes-list-type: atomic
                  timestamp:
                    description: Timestamp is when the usage was last refreshed.
                    format: date-time
                    type: string
                type: object
            type: object
        required:
