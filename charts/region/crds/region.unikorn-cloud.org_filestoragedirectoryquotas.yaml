    kind: FileStorageDirectoryQuota
    listKind: FileStorageDirectoryQuotaList
    plural: filestoragedirectoryquotas
    singular: filestoragedirectoryquota
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.labels['unikorn-cloud\.org/name']
      name: display name
      type: string
    - jsonPath: .spec.fileStorageID
      name: file storage
      type: string
    - jsonPath: .spec.path
